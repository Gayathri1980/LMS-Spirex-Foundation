<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LMS API Management</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark">L</div><div><h1>LMS Console</h1><span>API Management</span></div></div>
    <nav id="nav"></nav>
  </aside>
  <main class="main">
    <header class="topbar"><div><h2 id="title"></h2></div>
      <button id="menuBtn" class="btn btn-ghost mobile-toggle">☰ Menu</button></header>
    <div id="view"></div>
  </main>
</div>

<div class="modal-backdrop" id="modal">
  <div class="modal">
    <div class="modal-head"><h3 id="modalTitle"></h3><button class="modal-close" id="modalClose">✕</button></div>
    <form id="form">
      <div class="modal-body"><div class="form-grid" id="formFields"></div></div>
      <div class="modal-foot">
        <button type="button" class="btn btn-ghost" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>
</div>
<div id="toast-stack"></div>
<script src="script.js"></script>
</body>
</html>
